name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: "perl ${{ matrix.perl }} on ubuntu"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.36', '5.38', '5.40']
    steps:
      - uses: actions/checkout@v4

      - name: Set up perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install dependencies
        run: cpanm --notest --installdeps .

      - name: Build
        run: |
          perl Makefile.PL
          make

      - name: Test
        run: make test

      - name: Manifest is in sync (no test/dist file left out of the release)
        run: >
          perl -MExtUtils::Manifest=manicheck,filecheck
          -e 'my @m = manicheck; my @e = filecheck; die "MANIFEST out of sync\n" if @m || @e;'

      - name: Developer differential tests (against Spooky::Patterns::XS, if it installs)
        continue-on-error: true
        run: |
          cpanm --notest Spooky::Patterns::XS || true
          prove -b xt/
